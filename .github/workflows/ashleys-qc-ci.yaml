  collect-all-logs:
    name: "📦 Collect All CI Logs"
    runs-on: ubuntu-latest
    needs:
      [
        code-quality,
        workflow-lint,
        container-validation,
        comprehensive-workflow-testing,
        integration-testing,
      ]
    if: always()
    steps:
      - name: "📦 Collect all workflow logs"
        uses: actions/upload-artifact@v4
        with:
          name: all-ci-logs-${{ github.run_id }}
          path: |
            .snakemake/log/
            *.log
            **/log/
            **/*.log
          retention-days: 30
          if-no-files-found: ignore
